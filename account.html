	<style>
	body
	{
		background-color: white !important;
	}

		
	.btn-primary, .tox .tox-dialog__footer .tox-button:last-child, .tox .tox-button
	{
		--phoenix-btn-color: #fff;
		--phoenix-btn-bg: #bd8a6a;
		--phoenix-btn-border-color: transparent;
		--phoenix-btn-hover-color: #fff;
		--phoenix-btn-hover-bg: #bd8a6a;
		--phoenix-btn-hover-border-color: rgba(0, 0, 0, 0.2);
		--phoenix-btn-focus-shadow-rgb: 255, 255, 255;
		--phoenix-btn-active-color: #fff;
		--phoenix-btn-active-bg: #bd8a6a;
		--phoenix-btn-active-border-color: rgba(0, 0, 0, 0.25);
		--phoenix-btn-active-shadow: inset 0 3px 5px rgba(0, 0, 0, 0);
		--phoenix-btn-disabled-color: #fff;
		--phoenix-btn-disabled-bg: #9e755c;
		--phoenix-btn-disabled-border-color: transparent;
	}
		
	.btn, .google-map-control-btn .zoomIn, .google-map-control-btn .zoomOut, .tox .tox-dialog__footer .tox-button:last-child, .tox .tox-dialog__footer
	.tox-button--secondary, .tox .tox-button-secondary, .tox .tox-button, [data-list] .page, .table-list .page
	{
			display: initial;
	}

	.coffee-image
	{
		height: 225px;
		width: 100%;
		margin: inherit;
		border-radius: 15px 15px 0px 0px;
	}

	.logo-badge
	{
	    width: 40px;
	    height: 40px;
	    background: #bd8a6a;
	    border-radius: 0.5rem;
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    color: white;
	    font-weight: bold;
	}

	<!-- toast css -->
	.toast-bottom-right
	{
	    max-height: 80vh !important;
	}

	.no-scroll
	{
		overflow: hidden;
		position: relative;
	}
	.no-scroll-padding
	{
		margin-right: 15px !important;
	}

	.alternate-landing
	{
		background-color: unset !important;
		padding: 6em 3em 3em 3em;
	}

	@media (max-width: 576px)
	{
		.alternate-landing
		{
			padding: 6em 1em 3em 1em;
		}
	}

	@media (min-width: 1540px)
	{
		.hero-header-container-alternate
		{
			padding-top: 13rem;
			padding-bottom: 9rem;
		}
	}

	.nav-link
	{
		position: relative;
	}

	.icon-indicator-primary::before
	{
		display: none;
	}

	.icon-indicator-number
	{
		position: absolute;
		top: 12px;
		right: 5px;
		transform: translate(50%, -50%);
		background-color: #bd8a6a;
		color: #fff;
		border-radius: 50%;
		padding: 2px 6px;
		font-size: 10px;
	}
	.dropdown-submenu
	{
		position: relative;
	}

	.dropdown-submenu .dropdown-menu
